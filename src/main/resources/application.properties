spring.application.name=el-buen-sabor
# ============================================
# CONEXIÓN A MYSQL - RESTAURANTE BUEN SABOR
# ============================================

spring.datasource.url=jdbc:mysql://localhost:3306/restaurante_db?useSSL=false&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=mysql

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del servidor
server.port=8080

# Mostrar todas las consultas SQL que se ejecutan
logging.level.org.hibernate.SQL=DEBUG

# Mostrar los valores reales de los parámetros (ej: qué ID de plato se está actualizando)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Mostrar logs de nuestro propio paquete (para ver nuestros mensajes personalizados)
logging.level.com.elbuensabor.restaurantapi=DEBUG

# Mostrar información de transacciones (para ver cuándo se abren y cierran)
logging.level.org.springframework.transaction=TRACE