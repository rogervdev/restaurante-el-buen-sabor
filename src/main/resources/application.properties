spring.application.name=el-buen-sabor

# ============================================
# CONEXIÓN A MYSQL - RESTAURANTE BUEN SABOR
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/restaurante_db?useSSL=false&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=mysql

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del servidor
server.port=8080

# ============================================
# LOGS Y DEPURACIÓN
# ============================================
# Consultas SQL
logging.level.org.hibernate.SQL=DEBUG

# Parámetros SQL (compatibilidad moderna y anterior)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Logs de la aplicación
logging.level.com.elbuensabor.restaurantapi=DEBUG

# Transacciones
logging.level.org.springframework.transaction=TRACE

# Tráfico y ruteo SOAP
logging.level.org.springframework.ws=DEBUG